name: Publish npm package

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a manual publish
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Increment package version
        id: package
        run: |
          set -euo pipefail
          package_name=$(node --print "require('./package.json').name")
          published_version=$(npm view "$package_name" version 2>/dev/null || true)

          if [[ -n "$published_version" ]]; then
            npm version "$published_version" --no-git-tag-version --allow-same-version
            npm version "${{ inputs.bump || 'patch' }}" --no-git-tag-version
          fi

          echo "name=$package_name" >> "$GITHUB_OUTPUT"

      - run: npm run build
      - run: npm publish --access public

      - name: Update GitHub Raw userscript
        run: |
          set -euo pipefail
          raw_dir="$(mktemp -d)/userscript"

          if git fetch origin userscript; then
            git worktree add --detach "$raw_dir" FETCH_HEAD
          else
            git worktree add --detach "$raw_dir"
            git -C "$raw_dir" switch --orphan userscript
          fi

          cp dist/tinyShield.user.js "$raw_dir/tinyShield.user.js"
          git -C "$raw_dir" config user.name "github-actions[bot]"
          git -C "$raw_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$raw_dir" add tinyShield.user.js
          git -C "$raw_dir" commit -m "chore: update built userscript [skip ci]"
          git -C "$raw_dir" push origin HEAD:userscript

      - name: Purge jsDelivr latest cache
        continue-on-error: true
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          latest_purge_url="https://purge.jsdelivr.net/npm/${PACKAGE_NAME}@latest/dist/tinyShield.user.js"

          curl --fail-with-body --silent --show-error --retry 20 --retry-delay 6 --retry-all-errors "$latest_purge_url"
