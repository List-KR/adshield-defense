name: Publish npm package

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a manual publish
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION_BUMP: ${{ inputs.bump || 'patch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Increment package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(node --print "require('./package.json').name")
          published_version=$(npm view "$package_name" version 2>/dev/null || true)

          if [[ -n "$published_version" ]]; then
            npm version "$published_version" --no-git-tag-version --allow-same-version
            npm version "$VERSION_BUMP" --no-git-tag-version
          fi

          echo "name=$package_name" >> "$GITHUB_OUTPUT"

      - run: npm run build
      - run: npm publish --dry-run
      - run: npm publish --access public

      - name: Purge jsDelivr latest cache
        continue-on-error: true
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          latest_purge_url="https://purge.jsdelivr.net/npm/${PACKAGE_NAME}@latest/dist/tinyShield.user.js"

          curl --fail-with-body --silent --show-error --retry 20 --retry-delay 6 --retry-all-errors "$latest_purge_url"
